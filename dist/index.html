<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>扫雷 - DSH GameCenter</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="game-container">
    <div class="toolbar">
      <select id="difficulty-select" class="difficulty-select">
        <option value="beginner">初级 (9x9, 10雷)</option>
        <option value="intermediate">中级 (16x16, 40雷)</option>
        <option value="expert">高级 (30x16, 99雷)</option>
      </select>
      <select id="mode-select" class="difficulty-select">
        <option value="ai-noguess">AI 无猜模式</option>
        <option value="classic">传统无AI模式</option>
      </select>
      <button id="pause-btn" class="btn">暂停</button>
    </div>

    <div class="header-panel">
      <div id="mine-count" class="digital-display">010</div>
      <button id="face-btn" class="face-btn" title="重新开始">😊</button>
      <div id="timer" class="digital-display">000</div>
    </div>

    <div class="board-wrapper">
      <div id="board" class="board"></div>
      <div id="pause-overlay" class="pause-overlay" style="display: none;">
        <span>游戏已暂停</span>
        <span style="font-size: 13px; font-weight: normal; margin-top: 8px;">时钟与状态已冻结</span>
      </div>
    </div>

    <div class="footer-info">
      <div>
        <span>对局模式：</span>
        <span id="ai-status-badge" class="status-badge badge-fallback">AI 状态：未开始</span>
      </div>
      <div>
        <span>存档状态：</span>
        <span id="checkpoint-rev" class="status-badge">rev 0</span>
      </div>
    </div>
  </div>

  <script src="./game.js"></script>
</body>
</html>
